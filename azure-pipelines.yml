trigger:
- main
- feature/*

pool:
  name: Default



stages:
  - stage: TerraformPlan
    displayName: terraform init, validate and plan
    jobs:
      - job: TerraformInitValidatePlan
        steps:
        - checkout: self
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Parent Modules'
            backendServiceArm: 'AZ-ADO-Connection'
            backendAzureRmResourceGroupName: 'rgstatefile'
            backendAzureRmStorageAccountName: 'stgstatefile2'
            backendAzureRmContainerName: 'statecontainer'
            backendAzureRmKey: 'restart.tfstate'
        
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Parent Modules'
        
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Parent Modules'
            environmentServiceNameAzureRM: 'AZ-ADO-Connection'
  - stage: TerraformApply
    dependsOn: TerraformPlan
    displayName: TerraformApply
    jobs:
      - job: TerraformApply
        displayName: TerraformInittoApply
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Parent Modules'
            backendServiceArm: 'AZ-ADO-Connection'
            backendAzureRmResourceGroupName: 'rgstatefile'
            backendAzureRmStorageAccountName: 'stgstatefile2'
            backendAzureRmContainerName: 'statecontainer'
            backendAzureRmKey: 'restart.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Parent Modules'
            environmentServiceNameAzureRM: 'AZ-ADO-Connection'
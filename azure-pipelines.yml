trigger:
- main
- feature/*

pool:
  name: Default

stages:

# =========================
# TERRAFORM PLAN
# =========================
- stage: TerraformPlan
  displayName: Terraform Init, Validate and Plan

  jobs:
  - job: TerraformInitValidatePlan
    steps:

    - checkout: self

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Parent Modules'
        backendServiceArm: 'AZ-ADO-Connection'
        backendAzureRmResourceGroupName: 'rgstatefile'
        backendAzureRmStorageAccountName: 'stgstatefile2'
        backendAzureRmContainerName: 'statecontainer'
        backendAzureRmKey: 'restart.tfstate'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Parent Modules'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Parent Modules'
        environmentServiceNameAzureRM: 'AZ-ADO-Connection'


# =========================
# TERRAFORM APPLY
# =========================
- stage: TerraformApply
  displayName: Terraform Apply

  # Apply stage only after Plan stage
  dependsOn: TerraformPlan

  # Apply ONLY on main branch
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:
  - job: ManualApproval
    displayName: Manual Approval
    pool: server

    steps:
    - task: ManualValidation@0
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: 'your-email@company.com'
        instructions: 'Approve to run Terraform Apply.'
        onTimeout: 'reject'


  # =========================
  # TERRAFORM APPLY
  # =========================
  - job: TerraformApply
    displayName: Terraform Init to Apply

    dependsOn: ManualApproval

    condition: succeeded()

    steps:

    - checkout: self

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Parent Modules'
        backendServiceArm: 'AZ-ADO-Connection'
        backendAzureRmResourceGroupName: 'rgstatefile'
        backendAzureRmStorageAccountName: 'stgstatefile2'
        backendAzureRmContainerName: 'statecontainer'
        backendAzureRmKey: 'restart.tfstate'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Parent Modules'
        environmentServiceNameAzureRM: 'AZ-ADO-Connection'
